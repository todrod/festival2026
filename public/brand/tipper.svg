<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" role="img" aria-label="Tipper the strawberry mascot">
  <!-- Tipper: berry-person mascot — red strawberry, leaf crown with whipped
       cream, green apron with name tag, eyelashes. -->
  <ellipse cx="100" cy="238" rx="52" ry="8" fill="#000" opacity=".15"/>
  <!-- legs -->
  <rect x="82" y="196" width="12" height="28" rx="6" fill="#111"/>
  <rect x="106" y="196" width="12" height="28" rx="6" fill="#111"/>
  <!-- shoes -->
  <g>
    <ellipse cx="80" cy="228" rx="20" ry="9" fill="#f5e021"/>
    <ellipse cx="80" cy="226" rx="16" ry="7" fill="#111"/>
    <ellipse cx="120" cy="228" rx="20" ry="9" fill="#f5e021"/>
    <ellipse cx="120" cy="226" rx="16" ry="7" fill="#111"/>
  </g>
  <!-- arms -->
  <rect x="18" y="118" width="34" height="11" rx="5.5" fill="#111" transform="rotate(28 35 123)"/>
  <rect x="148" y="118" width="34" height="11" rx="5.5" fill="#111" transform="rotate(-28 165 123)"/>
  <!-- gloves -->
  <g fill="#fff" stroke="#111" stroke-width="3">
    <circle cx="26" cy="148" r="11"/>
    <circle cx="174" cy="148" r="11"/>
  </g>
  <!-- body -->
  <path d="M100 26c46 0 76 30 76 68 0 42-32 82-76 100C56 176 24 136 24 94c0-38 30-68 76-68z" fill="#ec2027" stroke="#111" stroke-width="4"/>
  <!-- seeds -->
  <g fill="#f5e021">
    <circle cx="55" cy="80" r="5"/><circle cx="145" cy="80" r="5"/>
    <circle cx="40" cy="110" r="5"/><circle cx="160" cy="110" r="5"/>
    <circle cx="60" cy="140" r="5"/><circle cx="140" cy="140" r="5"/>
    <circle cx="76" cy="60" r="5"/><circle cx="124" cy="60" r="5"/>
  </g>
  <!-- apron -->
  <path d="M56 128h88l8 62c-28 16-76 16-104 0z" fill="#1e7a34" stroke="#111" stroke-width="4"/>
  <path d="M62 128c10-10 66-10 76 0l2 12H60z" fill="#1e7a34" stroke="#111" stroke-width="4"/>
  <rect x="102" y="140" width="42" height="17" rx="2" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="123" y="153" font-family="Comic Sans MS, Chalkboard, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111">TIPPER</text>
  <!-- leaf crown -->
  <g fill="#2ba843" stroke="#111" stroke-width="3.5" stroke-linejoin="round">
    <path d="M100 34C86 20 62 14 46 22c12 4 20 12 24 22z"/>
    <path d="M100 34c14-14 38-20 54-12-12 4-20 12-24 22z"/>
    <path d="M100 30c-6-10-4-20 2-26 4 8 10 12 16 14z"/>
    <path d="M100 34c-10-6-26-6-34 2 8 2 14 8 16 14z"/>
    <path d="M100 34c10-6 26-6 34 2-8 2-14 8-16 14z"/>
  </g>
  <!-- whipped cream dollop + stem -->
  <path d="M78 26c0-8 8-12 14-9 2-8 14-8 17-1 8-4 16 2 14 10 1 6-5 10-11 9H88c-6 1-10-4-10-9z" fill="#fff" stroke="#111" stroke-width="3.5"/>
  <path d="M99 12c1-6 4-9 8-11" fill="none" stroke="#2ba843" stroke-width="6" stroke-linecap="round"/>
  <!-- face -->
  <g>
    <ellipse cx="80" cy="86" rx="12" ry="14" fill="#fff" stroke="#111" stroke-width="3"/>
    <ellipse cx="120" cy="86" rx="12" ry="14" fill="#fff" stroke="#111" stroke-width="3"/>
    <circle cx="83" cy="89" r="6.5" fill="#111"/>
    <circle cx="117" cy="89" r="6.5" fill="#111"/>
    <!-- eyelashes -->
    <g stroke="#111" stroke-width="2.5" stroke-linecap="round">
      <path d="M66 74l-7-5"/><path d="M70 70l-5-7"/><path d="M76 68l-3-8"/>
      <path d="M134 74l7-5"/><path d="M130 70l5-7"/><path d="M124 68l3-8"/>
    </g>
    <!-- smile -->
    <path d="M76 112c8 12 40 12 48-2-2 14-12 22-24 22s-22-8-24-20z" fill="#fff" stroke="#111" stroke-width="3.5"/>
    <path d="M90 128c6 3 14 3 20-1l-2 4c-5 3-12 3-16 0z" fill="#f9b7c8"/>
    <path d="M74 110c4-4 10-5 14-2" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="86" cy="107" rx="6" ry="3.5" fill="#e84a94"/>
  </g>
</svg>
