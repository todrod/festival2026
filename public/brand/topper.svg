<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" role="img" aria-label="Topper the strawberry mascot">
  <!-- Topper: berry-person mascot — red strawberry, white baker cap, green bow
       tie and apron with name tag, yellow sneakers. -->
  <ellipse cx="100" cy="238" rx="52" ry="8" fill="#000" opacity=".15"/>
  <!-- legs -->
  <rect x="82" y="196" width="12" height="28" rx="6" fill="#111"/>
  <rect x="106" y="196" width="12" height="28" rx="6" fill="#111"/>
  <!-- sneakers -->
  <g stroke="#111" stroke-width="3">
    <path d="M58 222c0-8 12-12 24-8l4 10c0 5-6 8-14 8s-14-4-14-10z" fill="#f5e021"/>
    <ellipse cx="70" cy="228" rx="12" ry="5" fill="#fff"/>
    <path d="M114 222c0-8 12-12 24-8l4 10c0 5-6 8-14 8s-14-4-14-10z" fill="#f5e021"/>
    <ellipse cx="126" cy="228" rx="12" ry="5" fill="#fff"/>
  </g>
  <!-- arms -->
  <rect x="18" y="118" width="34" height="11" rx="5.5" fill="#111" transform="rotate(28 35 123)"/>
  <rect x="148" y="118" width="34" height="11" rx="5.5" fill="#111" transform="rotate(-28 165 123)"/>
  <!-- mitten gloves -->
  <g fill="#fff" stroke="#111" stroke-width="3">
    <circle cx="26" cy="150" r="12"/>
    <circle cx="20" cy="142" r="6"/>
    <circle cx="174" cy="150" r="12"/>
    <circle cx="180" cy="142" r="6"/>
  </g>
  <!-- body -->
  <path d="M100 26c46 0 76 30 76 68 0 42-32 82-76 100C56 176 24 136 24 94c0-38 30-68 76-68z" fill="#ec2027" stroke="#111" stroke-width="4"/>
  <!-- seeds -->
  <g fill="#f5e021">
    <circle cx="55" cy="84" r="5"/><circle cx="145" cy="84" r="5"/>
    <circle cx="42" cy="114" r="5"/><circle cx="158" cy="114" r="5"/>
    <circle cx="64" cy="142" r="5"/><circle cx="136" cy="142" r="5"/>
    <circle cx="70" cy="58" r="5"/><circle cx="130" cy="58" r="5"/>
  </g>
  <!-- spiky leaves under cap -->
  <g fill="#1e7a34" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M70 40L54 22l22 8z"/>
    <path d="M126 38l20-14-10 20z"/>
    <path d="M92 34l-6-20 16 14z"/>
  </g>
  <!-- baker cap -->
  <g stroke="#111" stroke-width="3.5">
    <path d="M64 34c-2-16 16-28 36-28s40 10 40 24c0 8-6 14-14 16l-56 2c-4-4-6-9-6-14z" fill="#fff"/>
    <path d="M60 44c20-8 66-10 84-4l-4 8c-20-6-58-4-76 2z" fill="#fff"/>
    <path d="M96 6c0-4 8-4 8 0v4h-8z" fill="#fff"/>
  </g>
  <!-- face -->
  <g>
    <path d="M70 62c4-4 12-4 16 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <path d="M114 60c4-4 12-4 16 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="82" cy="82" rx="12" ry="15" fill="#fff" stroke="#111" stroke-width="3"/>
    <ellipse cx="118" cy="82" rx="12" ry="15" fill="#fff" stroke="#111" stroke-width="3"/>
    <circle cx="85" cy="85" r="6.5" fill="#111"/>
    <circle cx="115" cy="85" r="6.5" fill="#111"/>
    <path d="M74 106c10 12 42 10 50-4 0 16-11 26-25 26-13 0-23-9-25-22z" fill="#fff" stroke="#111" stroke-width="3.5"/>
    <path d="M88 124c7 3 16 2 22-2l-2 5c-6 3-14 3-18 0z" fill="#f9b7c8"/>
  </g>
  <!-- bow tie -->
  <g fill="#1e7a34" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M100 134l-24-10v22z"/>
    <path d="M100 134l24-10v22z"/>
    <circle cx="100" cy="134" r="6"/>
  </g>
  <!-- apron -->
  <path d="M58 146h84l8 48c-28 16-72 16-100 0z" fill="#1e7a34" stroke="#111" stroke-width="4"/>
  <rect x="104" y="156" width="42" height="17" rx="2" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="125" y="169" font-family="Comic Sans MS, Chalkboard, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#111">TOPPER</text>
</svg>
